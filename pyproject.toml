[project]
name = "osdless"
version = "0.1.0"
description = "Change ASUS gaming monitor settings from Linux without the OSD: OLED care, power, KVM and inputs over DDC/CI, with checked writes on top of ddcutil"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Claudio Wunder", email = "cwunder@gnome.org" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["ddc-ci", "ddcutil", "mccs", "monitor", "oled", "asus", "linux"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/ovflowd/osdless"

[project.scripts]
osdless = "osdless:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["osdless"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["osdless", "rig", "fake_ddcutil"]
